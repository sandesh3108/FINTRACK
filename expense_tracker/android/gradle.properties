org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin (AGP 9). This MUST stay true: plugins such as file_picker only
# apply the Kotlin Gradle Plugin when AGP is below 9, relying on AGP to compile
# their .kt sources. With it false, those modules produce an empty AAR and the
# app fails with "cannot find symbol FilePickerPlugin" in
# GeneratedPluginRegistrant.java.
android.builtInKotlin=true
